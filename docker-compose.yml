services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8010:8000"
    volumes:
      - backend_results:/app/storage/results

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run start -- -H 0.0.0.0 -p 3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  backend_results:
